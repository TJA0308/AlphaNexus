# Weekly dependency update PRs. Updates are grouped per ecosystem so they
# arrive as one PR each rather than one per package.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        # Majors arrive as their own PRs. pandas 2 -> 3 once came inside this
        # group; it was safe (benchmark output identical to the last decimal),
        # but a major deserves its own review rather than riding along.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    ignore:
      # These majors move together as one Next 16 migration: eslint-config-next
      # 16 needs Next 16, and Next 15's lint setup does not support ESLint 10.
      # Proposed one at a time, each fails CI.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Type definitions should match the Node version the app runs on (22).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
        # Majors (e.g. Next 16) need real migration work, so they come
        # separately and are not bundled into the routine update.
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # The image stays on the Python that Render (runtime.txt) and CI use, so
      # CI tests what the container runs. Upgrading Python is a deliberate
      # change to all three, not a routine bump.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
