name: Keep backend warm

# Render's free tier sleeps the API after ~15 minutes idle, so cold starts
# cost the first visitor up to ~30s. This pings /health often enough to
# keep the instance awake during normal viewing hours.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error https://alphanexus-api.onrender.com/health
