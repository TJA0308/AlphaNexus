name: Keep backend warm

# Render's free tier sleeps the API after ~15 minutes idle, and waking it has
# taken 40s+. This is a fallback only: GitHub runs scheduled workflows on a
# best-effort basis, and in practice this one ran every 3-5 hours rather than
# every 10 minutes. An external uptime monitor pinging /health every 5 minutes
# is what actually keeps the API awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        # A sleeping instance can take 40s+ to answer, and may return errors
        # while it boots. Retrying with a long timeout turns a cold start into
        # a (slow) success rather than a failed run.
        run: >-
          curl --fail --silent --show-error
          --max-time 90 --retry 5 --retry-all-errors --retry-delay 10
          https://alphanexus-api.onrender.com/health
