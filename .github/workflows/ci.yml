name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Python
        run: make lint

      # Fails below the floor in pyproject.toml, and writes the per-file
      # table to the run's summary page.
      - name: Run Python tests with coverage
        run: pytest --cov --cov-report=term --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

      - name: Run deterministic backtest benchmark
        run: make benchmark

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Type-check frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag alphanexus-api:ci .

      - name: Verify container health
        run: |
          docker run --detach --name alphanexus-api --publish 8000:8000 alphanexus-api:ci
          trap 'docker rm --force alphanexus-api' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs alphanexus-api
          exit 1
