[project]
name = "alphanexus"
version = "0.1.0"
description = "Full-stack strategy backtesting workbench for market data research."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, and pyupgrade.
select = ["E", "F", "W", "I", "B", "UP"]
